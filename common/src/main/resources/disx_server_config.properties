#Disx Server-Side Config

#Player-Use Whitelist: Enable/disable, then list players by username who can use audio playback if applicable
#default = false
player_use_whitelist_enabled= false

#Maxmimum Audio Players: Set how many audio players you want maximum at a time in your server.
#INTEGERS >0 ONLY
#default = 9999
max_audio_players= 9999

#Debug Mode: Enable/disable debug mode (prints a lot more logs from Disx to help fix bugs)
#default = false
debug_mode= false

#Audio Radius: An integer (whole number) that represents how far away sound can be heard from each Advanced Jukebox
#default = 25
audio_radius= 25

#Sound Particles: Whether the Advanced Jukebox or Ender Advanced Jukebox should emit note particles
#default = true
sound_particles= true

#WWW2PCM Target: The mod uses a web API called WWW2PCM to source audio data. Change this if you wish to use your own self-hosted version of this instead of the global offering.
#default = default
www2pcm_target= default

#Direct URL Enabled: Allow users to burn direct audio file URLs to discs. ONLY ENABLE IF YOUR WWW2PCM API SERVER HAS IT ENABLED, OTHERWISE THIS IS POINTLESS.
#default = false
direct_url_enabled = false

#Cache Files Maximum Size: How many GB of storage are you ok with the mod occupying on your server for the purposes of caching audio?
#default = 5
cache_files_max_size = 5

#DO NOT EDIT BELOW THIS LINE!-----------------------------
config_version= 5
config_env= server